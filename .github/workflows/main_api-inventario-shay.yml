# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - api-inventario-shay

on:
  push:
    branches:
      - main
    paths: 
      - "Backend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build Backend/Backend.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish Backend/Backend.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E73EB73C58F0451AA44E0EC570393FAA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_31F220396AFB4FBC9B8D844D2287FDE0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_38735323CA3E44CF9484A17AA939BC56 }}

      - name: Configurar runtime .NET 10 en Azure App Service
        run: |
          KIND=$(az webapp show \
            --resource-group api-inventario-shay_group-8f29 \
            --name api-inventario-shay \
            --query kind -o tsv)

          if echo "$KIND" | grep -qi linux; then
            echo "App Service Linux detectado: configurando DOTNETCORE|10.0"
            az webapp config set \
              --resource-group api-inventario-shay_group-8f29 \
              --name api-inventario-shay \
              --linux-fx-version "DOTNETCORE|10.0"
          else
            echo "App Service Windows detectado: configurando .NET v10.0"
            az webapp config set \
              --resource-group api-inventario-shay_group-8f29 \
              --name api-inventario-shay \
              --net-framework-version v10.0
          fi


      - name: Configuracion cadena PostgreSQL en Azure
        run: |
          az webapp config appsettings set \
            --resource-group api-inventario-shay_group-8f29 \
            --name api-inventario-shay \
            --settings ConnectionStrings__postgresRemote='${{ secrets.POSTGRESREMOTE }}'

      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-inventario-shay'
          slot-name: 'Production'
          package: .
          
